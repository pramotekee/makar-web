<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAR - We don't track the famous. We track the ones audiences actually listen to.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        root {
            --logo-color: #000000;
            --hero-bg: #FF9300;
            --hero-text: rgba(255,255,255,0.8);
            --primary: #000000;
            --pro-btn-bg: #0A1A4A;
            --pink: #FF99CC;
            --peach: #FFBB99;
            --lavender: #C99EF5;
            --offwhite: #F5F5F0;
            --mid: #444444;
        }
        body {
            font-family: 'DM Sans', 'Noto Sans Thai', sans-serif;
            background-color: #F5F5F0;
            color: #000000;
        }
        .hero-banner { background-color: #FF9300; }
        .glass-card { background: #FFFFFF; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .tier-badge { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .tier-jatu { background-color: #FFE6D5; color: #FF6600; }
        .tier-dao { background-color: #E8D8F8; color: #8A2BE2; }
        .tier-yama { background-color: #FFE0E6; color: #FF3366; }
        .metric-box { background-color: #F9F9F6; border-radius: 16px; padding: 12px; }
        .tooltip { position: relative; display: inline-block; }
        .tooltip .tooltiptext {
            visibility: hidden; width: 280px; background-color: #111111; color: #fff;
            text-align: left; border-radius: 12px; padding: 12px; position: absolute;
            z-index: 50; bottom: 125%; left: 50%; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.2s; font-size: 12px; line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-2xl font-black tracking-tight italic text-black">MAKAR</span>
            <button class="bg-[#0A1A4A] text-white px-5 py-2 rounded-xl text-xs font-bold tracking-wide">Access PRO</button>
        </div>
    </header>

    <section class="hero-banner text-center py-16 px-4">
        <h1 class="text-5xl font-black tracking-tighter text-black italic mb-3">MAKAR</h1>
        <p class="text-white/80 text-sm font-medium max-w-xl mx-auto mb-8">We don't track the famous. We track the ones audiences actually listen to.</p>
        
        <div class="flex justify-center items-center gap-12 max-w-md mx-auto">
            <div>
                <p id="totalCreators" class="text-2xl font-black text-black">-</p>
                <p class="text-xs text-white/70 font-medium mt-1">creators</p>
            </div>
            <div>
                <p id="totalCategories" class="text-2xl font-black text-black">-</p>
                <p class="text-xs text-white/70 font-medium mt-1">categories</p>
            </div>
            <div>
                <p class="text-2xl font-black text-black">10K–100K</p>
                <p class="text-xs text-white/70 font-medium mt-1">follower range</p>
            </div>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 mt-8">
        
        <section class="glass-card p-6 mb-8">
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search by name or username..." class="w-full pl-12 pr-4 py-3 bg-[#F5F5F0] rounded-xl text-sm border-none outline-none text-black">
            </div>

            <div class="flex flex-wrap items-center gap-2 text-sm border-b border-gray-100 pb-4 mb-4">
                <span class="text-gray-400 mr-2">Category</span>
                <div id="categoryFilters" class="flex flex-wrap gap-2">
                    <button class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-black text-white" data-cat="all">All</button>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 text-xs">
                <div class="flex items-center gap-2">
                    <span class="text-gray-400">Sort by</span>
                    <select id="sortSelect" class="bg-white border border-gray-200 px-3 py-2 rounded-xl font-medium outline-none">
                        <option value="score">Quality Score</option>
                        <option value="followers">Followers</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-gray-400">Growth period</span>
                    <button class="px-4 py-2 bg-black text-white rounded-full font-bold">30 days</button>
                    <button class="px-4 py-2 border border-purple-200 text-purple-500 rounded-full font-medium opacity-60 cursor-not-allowed"><i class="fa-solid fa-lock mr-1"></i> 60 days</button>
                    <button class="px-4 py-2 border border-purple-200 text-purple-500 rounded-full font-medium opacity-60 cursor-not-allowed"><i class="fa-solid fa-lock mr-1"></i> 180 days</button>
                    <button class="px-4 py-2 border border-purple-200 text-purple-500 rounded-full font-medium opacity-60 cursor-not-allowed"><i class="fa-solid fa-lock mr-1"></i> 365 days</button>
                </div>
            </div>
        </section>

        <div class="flex justify-between items-center mb-6 px-2">
            <p id="showingCounter" class="text-xs text-gray-500 font-medium">Showing 0 creators</p>
            <div class="flex gap-4 text-[10px] font-bold">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#FFE6D5]"></span> Jatum 10K–39K</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#E8D8F8]"></span> Dao 40K–79K</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#FFE0E6]"></span> Yama 80K–100K</span>
            </div>
        </div>

        <div id="creatorsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    </main>

    <script>
        const SHEET_ID = '1cWgB4yd29n_xuMMU3Y43cu5DrDZLtQ3Hff2l-GecusI';
        const CREATORS_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=creators`;
        const WEEKLY_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=weekly`;

        let allData = [];
        let activeCat = "all";
        let searchQuery = "";
        let sortBy = "score";

        function parseCSV(text) {
            const rows = text.split('\n').filter(r => r.trim());
            const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
            return rows.slice(1).map(row => {
                const values = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                let obj = {};
                headers.forEach((h, i) => obj[h] = values[i]);
                return obj;
            });
        }

        async function init() {
            try {
                const [cRes, wRes] = await Promise.all([fetch(CREATORS_CSV), fetch(WEEKLY_CSV)]);
                const creators = parseCSV(await cRes.text());
                const weekly = parseCSV(await wRes.text());

                const weeklyMap = {};
                weekly.forEach(w => {
                    const uname = (w.channel_username || w.Channel_username || "").trim().toLowerCase();
                    if(uname) weeklyMap[uname] = w;
                });

                allData = creators.map((c, index) => {
                    const uname = (c.channel_username || "").trim().toLowerCase();
                    const w = weeklyMap[uname] || {};
                    
                    let group = c.group || w.group || w.Group || "Jatum";
                    
                    return {
                        rank: index + 1,
                        name: c.channel_name || "undefined",
                        handle: c.channel_username || "undefined",
                        cat: c.category || "General",
                        group: group,
                        followers: parseInt(w.followers || w.Followers) || 0,
                        likes: parseInt(w.total_likes || w.Total_likes) || 0,
                        views: parseInt(w.avg_views || w.Avg_views) || 0,
                        shares: parseInt(w.avg_shares || w.Avg_shares) || 0,
                        score: parseFloat(w.Quality_score || w.quality_score) || 0
                    };
                });

                // Generate categories
                const cats = [...new Set(allData.map(d => d.cat).filter(Boolean))].sort();
                const catContainer = document.getElementById('categoryFilters');
                cats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-medium transition bg-white border border-gray-200 text-gray-600 hover:bg-gray-50";
                    btn.dataset.cat = cat;
                    btn.textContent = cat;
                    catContainer.appendChild(btn);
                });

                document.getElementById('totalCreators').textContent = allData.length;
                document.getElementById('totalCategories').textContent = cats.length;

                // Event Listeners
                document.querySelectorAll('.cat-btn').forEach(b => b.onclick = (e) => {
                    document.querySelectorAll('.cat-btn').forEach(x => {
                        x.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-medium transition bg-white border border-gray-200 text-gray-600";
                    });
                    e.target.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-black text-white";
                    activeCat = e.target.dataset.cat;
                    render();
                });

                document.getElementById('searchInput').oninput = (e) => { searchQuery = e.target.value.toLowerCase(); render(); };
                document.getElementById('sortSelect').onchange = (e) => { sortBy = e.target.value; render(); };

                render();
            } catch (e) { console.error(e); }
        }

        function formatNum(n) {
            if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if(n >= 1000) return (n/1000).toFixed(1) + 'K';
            return n;
        }

        function render() {
            const grid = document.getElementById('creatorsGrid');
            
            let filtered = allData.filter(d => {
                const mc = activeCat === "all" || d.cat === activeCat;
                const ms = d.name.toLowerCase().includes(searchQuery) || d.handle.toLowerCase().includes(searchQuery);
                return mc && ms;
            });

            if (sortBy === "score") {
                filtered.sort((a, b) => b.score - a.score);
            } else if (sortBy === "followers") {
                filtered.sort((a, b) => b.followers - a.followers);
            }

            document.getElementById('showingCounter').textContent = `Showing ${filtered.length} creators`;

            grid.innerHTML = filtered.map((d, i) => `
                <div class="glass-card p-6 relative flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="h-12 w-12 rounded-full bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-white font-bold text-lg shadow-inner">
                                    ?
                                </div>
                                <div>
                                    <h3 class="text-black font-bold text-base leading-tight">${d.name}</h3>
                                    <p class="text-gray-400 text-xs mt-0.5">@${d.handle}</p>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-gray-300">#${i + 1}</span>
                        </div>

                        <div class="flex gap-2 mb-4">
                            <span class="tier-badge tier-${d.group.toLowerCase()}">${d.group}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="metric-box">
                                <p class="text-[10px] text-gray-400 font-medium">Followers</p>
                                <p class="text-sm font-bold text-black mt-0.5">${formatNum(d.followers)}</p>
                            </div>
                            <div class="metric-box">
                                <p class="text-[10px] text-gray-400 font-medium">Total Likes</p>
                                <p class="text-sm font-bold text-black mt-0.5">${formatNum(d.likes)}</p>
                            </div>
                            <div class="metric-box">
                                <p class="text-[10px] text-gray-400 font-medium">Avg Views</p>
                                <p class="text-sm font-bold text-black mt-0.5">${formatNum(d.views)}</p>
                            </div>
                            <div class="metric-box">
                                <p class="text-[10px] text-gray-400 font-medium">Avg Shares</p>
                                <p class="text-sm font-bold text-black mt-0.5">${formatNum(d.shares)}</p>
                            </div>
                        </div>

                        <div class="flex justify-between items-center py-3 border-t border-b border-gray-100 mb-4">
                            <div class="flex items-center gap-1.5 text-xs text-gray-400">
                                <span>Quality Score</span>
                                <div class="tooltip">
                                    <i class="fa-solid fa-circle-info cursor-help text-gray-300"></i>
                                    <span class="tooltiptext">
                                        <strong>Calculated from:</strong><br>
                                        • Engagement rate per clip (Likes×1 + Comments×3 + Favorites×2 + Shares×5) ÷ Views = 60%<br>
                                        • Like-to-Follower ratio = 40%
                                    </span>
                                </div>
                            </div>
                            <span class="text-lg font-bold text-black">${d.score.toFixed(0)}</span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <button class="w-full py-2.5 bg-purple-50 border border-purple-100 text-purple-600 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 opacity-60 cursor-not-allowed">
                            <i class="fa-solid fa-lock text-[10px]"></i> View Growth chart (PRO)
                        </button>
                        <a href="https://www.tiktok.com/@${d.handle}" target="_blank" class="flex items-center justify-center gap-1.5 text-xs text-gray-400 hover:text-black transition py-1">
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> View on TikTok
                        </a>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
