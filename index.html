<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAR — Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        
        /* Tier Styling */
        .tier-leading { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .tier-growing { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .tier-rising { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        
        .score-display { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(255, 255, 255, 0.1); }
        .metric-pill { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Tooltip Customization */
        .tooltip .tooltiptext {
            visibility: hidden; width: 240px; background-color: #1e293b; color: #fff; text-align: center;
            border-radius: 12px; padding: 12px; position: absolute; z-index: 100; bottom: 125%; left: 50%;
            margin-left: -120px; opacity: 0; transition: opacity 0.3s; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-size: 11px; line-height: 1.5; font-weight: 400;
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="min-h-screen custom-scrollbar pb-12">

    <header class="border-b border-gray-800 bg-gray-900/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-chart-simple text-white text-sm"></i>
                </div>
                <span class="text-lg font-bold tracking-tight text-white italic">MAKAR</span>
            </div>
            <div id="lastUpdated" class="text-xs text-gray-400 bg-gray-800/60 px-3 py-1.5 rounded-lg border border-gray-700/50">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 inline-block mr-2"></span> Syncing Data...
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
        
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass-card rounded-2xl p-5 flex items-center space-x-4">
                <div class="p-3.5 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20"><i class="fa-solid fa-users text-xl"></i></div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Creators</p><p id="totalCreators" class="text-2xl font-bold text-white">-</p></div>
            </div>
            <div class="glass-card rounded-2xl p-5 flex items-center space-x-4">
                <div class="p-3.5 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20"><i class="fa-solid fa-tags text-xl"></i></div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Categories</p><p id="totalCategories" class="text-2xl font-bold text-white">-</p></div>
            </div>
            <div class="glass-card rounded-2xl p-5 flex items-center space-x-4">
                <div class="p-3.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><i class="fa-solid fa-chart-area text-xl"></i></div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Followers</p><p id="totalFollowers" class="text-2xl font-bold text-white">-</p></div>
            </div>
            <div class="glass-card rounded-2xl p-5 flex items-center space-x-4">
                <div class="p-3.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20"><i class="fa-solid fa-star text-xl"></i></div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Avg Quality</p><p id="avgQuality" class="text-2xl font-bold text-white">-</p></div>
            </div>
        </section>

        <section class="glass-card rounded-2xl p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-6 items-end">
                <div class="flex-1 w-full">
                    <p class="text-[10px] font-bold uppercase text-gray-500 mb-2 tracking-widest">Search</p>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-gray-500 text-sm"></i>
                        <input type="text" id="searchInput" placeholder="Search by name or username..." class="w-full pl-11 pr-4 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm focus:border-blue-500 outline-none text-white">
                    </div>
                </div>
                <div class="w-full md:w-auto">
                    <p class="text-[10px] font-bold uppercase text-gray-500 mb-2 tracking-widest">Tier</p>
                    <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-700">
                        <button class="tier-btn px-4 py-1.5 rounded-lg text-xs font-bold transition bg-blue-600 text-white" data-tier="all">ALL</button>
                        <button class="tier-btn px-4 py-1.5 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white" data-tier="Leading">LEADING</button>
                        <button class="tier-btn px-4 py-1.5 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white" data-tier="Growing">GROWING</button>
                        <button class="tier-btn px-4 py-1.5 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white" data-tier="Rising">RISING</button>
                    </div>
                </div>
            </div>
            <div class="mt-6 pt-6 border-t border-gray-800">
                <div id="categoryFilters" class="flex flex-wrap gap-2">
                    <button class="cat-btn px-4 py-1.5 rounded-xl text-[11px] font-bold transition bg-blue-600/10 border border-blue-500/30 text-blue-400" data-cat="all">ALL CATEGORIES</button>
                </div>
            </div>
        </section>

        <div id="creatorsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        
        <div id="emptyState" class="hidden text-center py-24 glass-card rounded-3xl border-dashed border-2 border-gray-800">
            <i class="fa-solid fa-face-frown text-4xl text-gray-600 mb-4"></i>
            <p class="text-gray-400">No creators matching your filters.</p>
        </div>

    </main>

    <script>
        const SHEET_ID = '1cWgB4yd29n_xuMMU3Y43cu5DrDZLtQ3Hff2l-GecusI';
        const CREATORS_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=creators`;
        const WEEKLY_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=weekly`;

        let allData = [];
        let activeTier = "all";
        let activeCat = "all";
        let query = "";

        // CSV Parser
        function parseCSV(text) {
            const rows = text.split('\n').filter(r => r.trim());
            const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
            return rows.slice(1).map(row => {
                const values = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                let obj = {};
                headers.forEach((h, i) => obj[h] = values[i]);
                return obj;
            });
        }

        // Initialize App & Load Google Sheets Data
        async function init() {
            try {
                const [cRes, wRes] = await Promise.all([fetch(CREATORS_CSV), fetch(WEEKLY_CSV)]);
                const cText = await cRes.text();
                const wText = await wRes.text();
                
                const creators = parseCSV(cText);
                const weekly = parseCSV(wText);

                const weeklyMap = {};
                weekly.forEach(w => {
                    const uname = (w.channel_username || w.Channel_username || "").trim().toLowerCase();
                    if(uname) weeklyMap[uname] = w;
                });

                allData = creators.map(c => {
                    const uname = (c.channel_username || "").trim().toLowerCase();
                    const w = weeklyMap[uname] || {};
                    
                    // Group Mapping Logic: Jatum -> Rising, Dao -> Growing, Yama -> Leading
                    let group = c.group || w.group || w.Group || "Rising";
                    if(group.toLowerCase() === 'jatum') group = 'Rising';
                    if(group.toLowerCase() === 'dao') group = 'Growing';
                    if(group.toLowerCase() === 'yama') group = 'Leading';

                    return {
                        ...c, ...w,
                        name: c.channel_name || w.channel_name || w.Channel_name || "undefined",
                        handle: uname,
                        cat: c.category || w.category || w.Category || "General",
                        group: group,
                        followers: parseInt(w.Followers || w.followers) || 0,
                        likes: parseInt(w.Total_likes || w.total_likes) || 0,
                        views: parseInt(w.Avg_views || w.avg_views) || 0,
                        shares: parseInt(w.Avg_shares || w.avg_shares) || 0,
                        score: parseFloat(w.Quality_score || w.quality_score) || 0
                    };
                });

                // Generate Category Filters Dynamically
                const cats = [...new Set(allData.map(d => d.cat).filter(Boolean))].sort();
                const catContainer = document.getElementById('categoryFilters');
                cats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = "cat-btn px-4 py-1.5 rounded-xl text-[11px] font-bold transition bg-gray-900 border border-gray-800 text-gray-500 hover:text-white";
                    btn.dataset.cat = cat;
                    btn.textContent = cat.toUpperCase();
                    catContainer.appendChild(btn);
                });

                // Set Upper Dashboard Overview Metrics
                document.getElementById('totalCreators').textContent = allData.length;
                document.getElementById('totalFollowers').textContent = (allData.reduce((a,b)=>a+b.followers,0)/1000).toFixed(1) + 'K';
                document.getElementById('avgQuality').textContent = (allData.reduce((a,b)=>a+b.score,0)/allData.length).toFixed(1);
                
                // Event Handling Configuration
                document.querySelectorAll('.cat-btn').forEach(b => b.onclick = (e) => {
                    document.querySelectorAll('.cat-btn').forEach(x => x.className = "cat-btn px-4 py-1.5 rounded-xl text-[11px] font-bold transition bg-gray-900 border border-gray-800 text-gray-500");
                    e.target.className = "cat-btn px-4 py-1.5 rounded-xl text-[11px] font-bold transition bg-blue-600/10 border border-blue-500/30 text-blue-400";
                    activeCat = e.target.dataset.cat; render();
                });

                document.querySelectorAll('.tier-btn').forEach(b => b.onclick = (e) => {
                    document.querySelectorAll('.tier-btn').forEach(x => x.className = "tier-btn px-4 py-1.5 rounded-lg text-xs font-bold transition text-gray-400");
                    e.target.className = "tier-btn px-4 py-1.5 rounded-lg text-xs font-bold transition bg-blue-600 text-white";
                    activeTier = e.target.dataset.tier; render();
                });

                document.getElementById('searchInput').oninput = (e) => { query = e.target.value.toLowerCase(); render(); };

                document.getElementById('lastUpdated').innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-emerald-500 inline-block mr-2"></span> Data Live`;
                render();
            } catch (e) { console.error(e); }
        }

        function formatNum(n) {
            if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if(n >= 1000) return (n/1000).toFixed(1) + 'K';
            return n;
        }

        // Render Cards to Grid
        function render() {
            const grid = document.getElementById('creatorsGrid');
            const filtered = allData.filter(d => {
                const mt = activeTier === "all" || d.group === activeTier;
                const mc = activeCat === "all" || d.cat === activeCat;
                const ms = d.name.toLowerCase().includes(query) || d.handle.toLowerCase().includes(query);
                return mt && mc && ms;
            });

            if(filtered.length === 0) { grid.innerHTML = ""; document.getElementById('emptyState').classList.remove('hidden'); return; }
            document.getElementById('emptyState').classList.add('hidden');

            grid.innerHTML = filtered.map(d => `
                <div class="glass-card rounded-3xl p-6 relative flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <span class="tier-badge ${'tier-' + d.group.toLowerCase()}">${d.group}</span>
                            
                            <div class="score-display rounded-2xl px-4 py-2 flex items-center gap-2 border-emerald-500/20">
                                <div class="text-right">
                                    <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest leading-none">Quality Score</p>
                                    <p class="text-xl font-black text-white leading-none mt-1">${d.score.toFixed(1)}</p>
                                </div>
                                <div class="tooltip relative">
                                    <i class="fa-solid fa-circle-info text-blue-400/80 text-xs cursor-help"></i>
                                    <span class="tooltiptext">คือคะแนนเฉลี่ยที่นำข้อมูลจาก user engagement อาทิ Like, Comment, Favorite, Share, Views และ Followers มาคำนวณเพื่อสรุปเป็นตัวเลขหนึ่ง ที่สะท้อนภาพรวมเชิงคุณภาพของครีเอเตอร์</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 mb-6">
                            <div class="h-14 w-14 rounded-2xl bg-gray-800 flex items-center justify-center text-xl font-bold text-gray-500 border border-gray-700 shadow-inner">
                                ${d.name.substring(0,1)}
                            </div>
                            <div class="overflow-hidden">
                                <h3 class="text-white font-bold text-lg truncate leading-tight">${d.name}</h3>
                                <p class="text-gray-500 text-xs mt-1">@${d.handle}</p>
                            </div>
                        </div>

                        <div class="flex gap-2 mb-6">
                            <span class="bg-gray-900 border border-gray-800 px-3 py-1 rounded-lg text-[10px] font-bold text-gray-400 uppercase tracking-tighter">${d.cat}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div class="metric-pill rounded-2xl p-3">
                                <p class="text-[9px] font-bold text-gray-500 uppercase">Followers</p>
                                <p class="text-sm font-bold text-white mt-1">${formatNum(d.followers)}</p>
                            </div>
                            <div class="metric-pill rounded-2xl p-3">
                                <p class="text-[9px] font-bold text-gray-500 uppercase">Total Likes</p>
                                <p class="text-sm font-bold text-white mt-1">${formatNum(d.likes)}</p>
                            </div>
                            <div class="metric-pill rounded-2xl p-3">
                                <p class="text-[9px] font-bold text-gray-500 uppercase">Avg Views</p>
                                <p class="text-sm font-bold text-white mt-1">${formatNum(d.views)}</p>
                            </div>
                            <div class="metric-pill rounded-2xl p-3">
                                <p class="text-[9px] font-bold text-gray-500 uppercase">Avg Shares</p>
                                <p class="text-sm font-bold text-white mt-1">${formatNum(d.shares)}</p>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-800">
                        <a href="https://www.tiktok.com/@${d.handle}" target="_blank" class="flex items-center justify-center gap-2 w-full py-3 bg-white/5 hover:bg-white/10 rounded-2xl text-xs font-bold text-gray-300 transition border border-white/5">
                            <i class="fa-brands fa-tiktok"></i> View in TikTok
                        </a>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
